name: Daily battle
# Writes today's Humans vs AI battle into Supabase. No commit, so it never triggers a site deploy.
on:
  schedule:
    - cron: '7 0 * * *'   # 00:07 UTC = 05:37 IST, just after the UTC day starts
  workflow_dispatch: {}
jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build and save the battle
        run: node scripts/make-battle.mjs || (sleep 30 && node scripts/make-battle.mjs)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATTLE_MODELS: ${{ vars.BATTLE_MODELS }}
          BATTLE_WRITER: ${{ vars.BATTLE_WRITER }}
